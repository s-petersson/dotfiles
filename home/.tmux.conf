unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal 'tmux-256color'
set-option -sa terminal-overrides ',xterm-kitty:RGB'
set-option -ga terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set-option -ga terminal-overrides ",screen*:Tc:smcup@:rmcup@"
set-option -ga terminal-overrides ",tmux*:Tc:smcup@:rmcup@"

# Neovim diagnostic underline compatibility through tmux.
set -as terminal-features ',xterm-kitty:RGB,usstyle'
set -as terminal-features ',tmux-256color:RGB,usstyle'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # underline style support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underline colors - needs tmux 3.0+

# Prefix is Ctrl-a
set -g prefix C-a

set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-256color:extkeys'
set -as terminal-features 'tmux-256color:extkeys'

set -g mouse on
set -g renumber-windows on
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

bind-key s split-window
bind-key v split-window -h

# Rebind kill-pane to not require confirmation
bind-key x kill-pane

unbind s

bind-key 'C-a' send-prefix
bind-key 't' run-shell 'tmux-popup'

bind-key -r -n 'C-,' resize-pane -L 5
bind-key -r -n 'C--' resize-pane -D 5
bind-key -r -n 'C-=' resize-pane -U 5
bind-key -r -n 'C-.' resize-pane -R 5
bind-key ? list-keys

# Scroll speed is 1 line at a time (mode-keys is vi, so copy-mode-vi is the active table)
bind -Tcopy-mode WheelUpPane send -N1 -X scroll-up
bind -Tcopy-mode WheelDownPane send -N1 -X scroll-down
bind -Tcopy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -Tcopy-mode-vi WheelDownPane send -N1 -X scroll-down

# Start window index from 1
set -g base-index 1

set-option -g status-position top

set -g @catppuccin_flavor "mocha"

# Gruvbox-inspired palette overrides.
# catppuccin uses `set -ogq` (only-if-not-set), so pre-setting here takes priority.
set -g @thm_bg "#1d2021"
set -g @thm_fg "#ebdbb2"
set -g @thm_rosewater "#ea6962"
set -g @thm_flamingo "#ea6962"
set -g @thm_pink "#d3869b"
set -g @thm_mauve "#d3869b"
set -g @thm_red "#ea6962"
set -g @thm_maroon "#ea6962"
set -g @thm_peach "#e78a4e"
set -g @thm_yellow "#d8a657"
set -g @thm_green "#a9b665"
set -g @thm_teal "#89b482"
set -g @thm_sky "#89b482"
set -g @thm_sapphire "#89b482"
set -g @thm_blue "#7daea3"
set -g @thm_lavender "#7daea3"
set -g @thm_subtext_1 "#d5c4a1"
set -g @thm_subtext_0 "#bdae93"
set -g @thm_overlay_2 "#a89984"
set -g @thm_overlay_1 "#928374"
set -g @thm_overlay_0 "#595959"
set -g @thm_surface_2 "#4d4d4d"
set -g @thm_surface_1 "#404040"
set -g @thm_surface_0 "#292929"
set -g @thm_mantle "#191b1c"
set -g @thm_crust "#141617"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_window_current_text "   #{s|.*/([^/]+/[^/]+)$|\\1|:pane_current_path} [#W]"
set -g @catppuccin_window_text "   #{s|.*/([^/]+/[^/]+)$|\\1|:pane_current_path} [#W]"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g window-status-current-format "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #{E:@catppuccin_window_current_text}  "
set -g window-status-format "#[fg=#{@thm_overlay_0},bg=#{@thm_mantle}] #{E:@catppuccin_window_text}  "

set -g status-left "#[fg=#{@thm_blue},bg=#{@thm_surface_0}]▌ #S #[fg=#{@thm_surface_0},bg=#{@thm_mantle}]◤ "
set -g status-right '#[fg=#{@thm_mantle},bg=#{@thm_surface_0}]◤#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{?window_zoomed_flag,  ,  }#[fg=#{?client_prefix,#{@thm_yellow},#{@thm_fg}}]#{?client_prefix,●,○} #[fg=#{@thm_blue}]▐'

set -g status-left-length 100
set -g status-right-length 100

source-file ~/.config/tmux/plugins/tmux-navigator.tmux
run ~/.config/tmux/plugins/sensible.tmux

bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 55%,60% \
    --reverse --no-sort --ansi --border=thinblock --border-label ' sesh ' --prompt '>  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --preview 'sesh preview {}' --preview-window 'right:55%,border-thinblock' \
    --color 'bg:#{@thm_bg},fg:#{@thm_fg},bg+:#{@thm_surface_0},fg+:#{@thm_blue},border:#{@thm_surface_0},preview-bg:#{@thm_mantle},label:#{@thm_blue},header:#{@thm_overlay_1},prompt:#{@thm_blue},pointer:#{@thm_pink},marker:#{@thm_green},hl:#{@thm_yellow},hl+:#{@thm_yellow},info:#{@thm_overlay_1}' \
    --bind 'ctrl-a:reload(sesh list --icons)' \
    --bind 'ctrl-t:reload(sesh list -t --icons)' \
    --bind 'ctrl-g:reload(sesh list -c --icons)' \
    --bind 'ctrl-x:reload(sesh list -z --icons)' \
    --bind 'ctrl-f:reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)'
)\""

bind-key "w" run-shell "sel=\"$(
  tmux-window-list | fzf-tmux -p 55%,60% \
    --reverse --no-sort --ansi --delimiter '\t' --with-nth 2 --border=thinblock --border-label ' windows ' --prompt '>  ' \
    --preview 'tmux capture-pane -ep -t {1}' --preview-window 'right:55%,border-thinblock' \
    --color 'bg:#{@thm_bg},fg:#{@thm_fg},bg+:#{@thm_surface_0},fg+:#{@thm_blue},border:#{@thm_surface_0},preview-bg:#{@thm_mantle},label:#{@thm_blue},header:#{@thm_overlay_1},prompt:#{@thm_blue},pointer:#{@thm_pink},marker:#{@thm_green},hl:#{@thm_yellow},hl+:#{@thm_yellow},info:#{@thm_overlay_1}' | cut -f1
)\"; if [ -n \"\$sel\" ]; then tmux switch-client -t \"\$sel\"; fi"
