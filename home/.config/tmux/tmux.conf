run-shell 'case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) tmux set-environment -g PATH "$HOME/.local/bin:$PATH" ;; esac'

# Prefix
set -g prefix C-a
bind -N "Send prefix" C-a send-prefix

# Config and help
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"
bind -N "Show keybindings" ? list-keys -N

# Copy mode
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# Panes
unbind h
bind -N "Split pane vertically" % split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically" v split-window -h -c "#{pane_current_path}"
bind -N "Split pane horizontally" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" s split-window -v -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane
bind -N "Swap pane left" H swap-pane -d -s :. -t '{left-of}'
bind -N "Swap pane down" J swap-pane -d -s :. -t '{down-of}'
bind -N "Swap pane up" K swap-pane -d -s :. -t '{up-of}'
bind -N "Swap pane right" L swap-pane -d -s :. -t '{right-of}'

# Windows
bind -N "Create window" t new-window -c "#{pane_current_path}"
bind -N "Move window left" -n C-S-Left swap-window -d -t -1
bind -N "Move window right" -n C-S-Right swap-window -d -t +1
bind -N "Next window" n next-window
bind -N "Next window" C-n next-window
bind -N "Previous window" p previous-window
bind -N "Previous window" C-p previous-window

# Pickers and popups
bind -N "Open popup session" c run-shell tmux-popup
bind -N "Create session from template" C display-popup -d "#{pane_current_path}" -x C -y C -w 20% -h 15% -B -E tmux-session-new
bind : command-prompt
bind -N "Apply template" A run-shell tmux-template-picker
bind -N "Choose session" w run-shell tmux-session-picker
bind -N "Choose window" g run-shell tmux-window-picker

# General
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB:usstyle:extkeys:clipboard'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g set-clipboard on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Window and terminal titles
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Status bar
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-style 'bg=#{@theme_mantle},fg=#{@theme_fg}'
set -g status-left '#[fg=#{@theme_blue},bg=#{@theme_surface}]▌ #S '
set -g status-right '#[fg=#{@theme_fg},bg=#{@theme_surface}] #{?window_zoomed_flag,  ,  }#[fg=#{?client_prefix,#{@theme_yellow},#{@theme_fg}}]#{?client_prefix,●,○} #[fg=#{@theme_blue}]▐'
set -g window-status-separator ''
set -g window-status-format '#[fg=#{@theme_overlay},bg=#{@theme_mantle}]    #{s|.*/([^/]+/[^/]+)$|\1|:pane_current_path} [#I]  '
set -g window-status-current-format '#[fg=#{@theme_fg},bg=#{@theme_bg}]    #{s|.*/([^/]+/[^/]+)$|\1|:pane_current_path} [#I]  '
set -g pane-border-style 'fg=#{@theme_surface}'
set -g pane-active-border-style 'fg=#{@theme_surface}'
set -g message-style 'bg=default,fg=#{@theme_blue},align=centre'
set -g message-command-style 'bg=default,fg=#{@theme_blue},align=centre'
set -g mode-style 'bg=#{@theme_blue},fg=#{@theme_bg},bold'
source-file ~/.local/state/dotfiles/theme/current/tmux.conf

source-file ~/.config/tmux/plugins/tmux-navigator.tmux
